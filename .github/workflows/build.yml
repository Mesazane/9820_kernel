name: Build KisekiKernel

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (OneUI8-9820) v2'
        required: true
        default: 'OneUI8-9820-v2'
      notes:
        description: 'Extra release notes (optional, shown above the changelog)'
        required: false
        default: ''
      label:
        description: 'Release label'
        required: true
        type: choice
        default: 'Latest'
        options:
          - 'Latest'
          - 'Pre-release'
          - 'None'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target: [beyond0lte, beyond1lte, beyond2lte, beyondx, d1, d2s]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Free disk space
        run: |
          echo "::group:: Cleaning up pre-installed software to free space"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          echo "::endgroup::"

      - name: Set up build environment
        run: |
          echo "::group:: Installing dependencies and tools"
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -yq \
            p7zip-full jq attr ccache clang ffmpeg golang \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp \
            curl xxd patchelf flex bison libarchive-tools build-essential pcre2-utils
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "::endgroup::"

      - name: Set up CCache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.target }}-

      - name: Build kernel (${{ matrix.target }})
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ~/.cache/ccache
        run: |
          chmod +x build.sh
          ./build.sh -m ${{ matrix.target }} -k y -r n

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: KisekiKernel-${{ matrix.target }}-zip
          path: build/out/${{ matrix.target }}/*.zip
          compression-level: 6

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source (for changelog)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw_artifacts

      - name: Flatten artifacts directory structure
        run: |
          mkdir -p final_artifacts
          find raw_artifacts/ -name "*.zip" -exec cp {} final_artifacts/ \;

      - name: Generate Safe Git Tag
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          SAFE_TAG=$(echo "$TAG_INPUT" | sed 's/[\/\\:*?"<>| ]/-/g')
          echo "SAFE_TAG=$SAFE_TAG" >> $GITHUB_ENV

      - name: Generate changelog
        env:
          EXTRA_NOTES: ${{ inputs.notes }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Previous One UI 8 release reachable from this commit (OneUI7 tags
          # belong to the main branch and are ignored).
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'OneUI8-*' \
                       --exclude "$SAFE_TAG" HEAD 2>/dev/null || true)
          KSU_VERSION=$(git -C KernelSU-Next describe --tags 2>/dev/null || echo "unknown")

          {
            echo "## Official Release for KisekiKernel 9820"
            echo
            echo "Automated build for **One UI 8 / 8.5**, generated by GitHub Actions."
            echo
            echo "- **Commit SHA:** \`${GITHUB_SHA}\`"
            echo "- **Tag Reference:** \`${SAFE_TAG}\`"
            echo "- **KernelSU-Next:** \`${KSU_VERSION}\`"
            echo

            if [ -n "$EXTRA_NOTES" ]; then
              echo "### Notes"
              echo
              echo "$EXTRA_NOTES"
              echo
            fi

            echo "### Changelog"
            echo
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
              echo
              git log --no-merges --pretty=format:"- %s ([\`%h\`](${REPO_URL}/commit/%H))" "${PREV_TAG}..HEAD"
              echo
              echo
              echo "**Full diff:** ${REPO_URL}/compare/${PREV_TAG}...${SAFE_TAG}"
            else
              echo "First One UI 8 release. Latest changes:"
              echo
              git log --no-merges -n 30 --pretty=format:"- %s ([\`%h\`](${REPO_URL}/commit/%H))"
              echo
            fi
            echo

            cat <<'EOF'
          ### Downloads

          #### Galaxy S10 Series
          | Device Name | Codename | File Name |
          | :--- | :--- | :--- |
          | Galaxy S10e | `beyond0lte` | `KisekiKernel-*-S10_beyond0lte_*.zip` |
          | Galaxy S10 | `beyond1lte` | `KisekiKernel-*-S10_beyond1lte_*.zip` |
          | Galaxy S10+ | `beyond2lte` | `KisekiKernel-*-S10_beyond2lte_*.zip` |
          | Galaxy S10 5G | `beyondx` | `KisekiKernel-*-S10_beyondx_*.zip` |

          #### Galaxy Note10 Series
          | Device Name | Codename | File Name |
          | :--- | :--- | :--- |
          | Galaxy Note10 | `d1` | `KisekiKernel-*-N10_d1_*.zip` |
          | Galaxy Note10+ | `d2s` | `KisekiKernel-*-N10_d2s_*.zip` |

          _Note: This build is for One UI 8 / 8.5 only. Ensure you are on the correct firmware base before flashing._
          EOF
          } > release_body.md

          cat release_body.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.SAFE_TAG }}
          name: "${{ inputs.tag }}"
          commit: ${{ github.sha }}
          draft: false
          # Latest      -> normal release, marked as latest
          # Pre-release -> marked as non-production ready, never latest
          # None        -> normal release, latest stays unchanged
          prerelease: ${{ inputs.label == 'Pre-release' }}
          makeLatest: ${{ inputs.label == 'Latest' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "final_artifacts/*.zip"
          bodyFile: release_body.md
